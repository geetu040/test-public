<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat with MySQL</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-container">
        <div class="navbar-logo">DataOrator</div>
        <div class="navbar-menu">
          <a href="home.html" class="navbar-link">Home</a>
          <a href="sql.html" class="navbar-link">MySQL</a>
          <a href="mongodb.html" class="navbar-link">MongoDB</a>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>Settings</h2>
        <p>
          This is a simple chat application using MySQL. Connect to the database
          and start chatting.
        </p>
        <input type="text" disabled placeholder="Uses Default Chinook Dataset." />
        <button id="connectBtn" disabled>Connect</button>
        <!-- Connection status dialogue box -->
        <div id="connectionStatus" class="connection-status"></div>
      </div>

      <!-- Chat Area -->
      <div class="chat-area">
        <h1>Chat with MySQL</h1>
        <div class="messages" id="messages">
          <div class="message-card message-bot">
            <span class="message-icon icon-bot">🤖</span>
            <span
              >Hello! I'm a SQL assistant. Ask me anything about your
              database.</span
            >
          </div>
        </div>

        <!-- Input Box -->
        <div class="input-box">
          <input type="text" id="userInput" placeholder="Ask anything" />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>

    <!-- Link to external JavaScript -->
    <script src="js/app.js"></script>
  </body>
</html>
